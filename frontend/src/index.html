<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Consultas Seguras</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Reserva de consultas médicas con protección de datos">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Aplica el tema antes de que Angular cargue, para que la página no parpadee
    (function () {
      var tema = null;
      try { tema = localStorage.getItem('tema'); } catch (e) {}
      if (tema !== 'claro' && tema !== 'oscuro') {
        tema = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
      }
      document.documentElement.setAttribute('data-tema', tema);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
